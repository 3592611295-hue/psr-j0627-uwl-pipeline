[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psr-j0627-uwl-pipeline"
version = "0.1.0"
description = "Reproducible Parkes/UWL PSRCHIVE pipeline for PSR J0627+0706"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PSR J0627+0706 analysis team" }]
dependencies = []

[project.scripts]
j0627-uwl = "j0627_uwl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
